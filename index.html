
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DroidGuard - Painel de Controle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121d22;
            --sidebar-color: #1a2a30;
            --card-bg: #1e333a;
            --accent-teal: #2f8e8b;
            --text-main: #e0e0e0;
            --btn-orange: #d35400;
        }
        body, html { margin: 0; padding: 0; font-family: sans-serif; background: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }
        .container { display: flex; min-height: 100vh; flex-direction: row; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar-color); padding: 20px; flex-shrink: 0; z-index: 10; }
        .sidebar h2 { color: var(--accent-teal); font-size: 22px; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; justify-content: center; }
        .sidebar nav ul { list-style: none; padding: 0; }
        .sidebar nav ul li { padding: 15px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; transition: 0.3s; }
        .sidebar nav ul li.active { background: var(--accent-teal); color: white; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        header { background: #16262c; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3f47; }
        .btn-exit { background: var(--btn-orange); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Grid */
        .dashboard { padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #2a3f47; }
        .card h3 { margin: 0 0 10px 0; font-size: 13px; color: #889ba3; text-transform: uppercase; border-bottom: 1px solid #2a3f47; padding-bottom: 5px; }
        .video-box { width: 100%; height: 200px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #444; position: relative; border: 1px solid #111; }
        .live-tag { position: absolute; top: 10px; left: 10px; background: #ff0000; color: white; font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; padding: 10px; height: auto; }
            .sidebar h2 { margin-bottom: 10px; font-size: 18px; }
            .sidebar nav ul { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
            .sidebar nav ul li { padding: 10px 15px; white-space: nowrap; font-size: 12px; }
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2><i class="fas fa-user-secret"></i> DroidGuard</h2>
            <nav>
                <ul>
                    <li class="active"><i class="fas fa-home"></i> Painel</li>
                    <li><i class="fas fa-camera"></i> Câmeras</li>
                    <li><i class="fas fa-desktop"></i> Tela</li>
                    <li><i class="fas fa-map-marker-alt"></i> GPS</li>
                    <li><i class="fas fa-sms"></i> Mensagens</li>
                </ul>
            </nav>
        </aside>
        <main class="main">
            <header>
                <div style="color:var(--accent-teal); font-weight:bold;">SISTEMA ONLINE</div>
                <button class="btn-exit">Sair</button>
            </header>
            <div class="dashboard">
                <div class="card">
                    <h3>Câmera Frontal</h3>
                    <div class="video-box"><span class="live-tag">LIVE</span>AGUARDANDO TERMUX...</div>
                </div>
                <div class="card">
                    <h3>Câmera Traseira</h3>
                    <div class="video-box"><span class="live-tag">LIVE</span>AGUARDANDO TERMUX...</div>
                </div>
                <div class="card">
                    <h3>Monitoramento de Tela</h3>
                    <div class="video-box" style="height: 300px;">OFFLINE</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
