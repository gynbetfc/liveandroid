
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidGuard - GPS Realtime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #0b1114; --side: #16262c; --card: #121d22; --teal: #2f8e8b; --white: #e0e0e0; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); height: 100vh; overflow: hidden; }
        .layout { display: flex; height: 100vh; flex-direction: column; }
        header { background: var(--side); padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #1f2d33; }
        #map { width: 100%; flex-grow: 1; }
        .status-bar { background: var(--side); padding: 10px; display: flex; justify-content: space-around; font-size: 12px; border-top: 1px solid #1f2d33; }
        .status-bar i { color: var(--teal); margin-right: 5px; }
    </style>
</head>
<body>
    <div class="layout">
        <header>
            <div style="color:var(--teal); font-weight:bold;"><i class="fas fa-satellite"></i> DROIDGUARD GPS</div>
            <div id="connection" style="color:#00ff00; font-size:10px;">● CONECTADO</div>
        </header>
        <div id="map"></div>
        <div class="status-bar">
            <span id="bat-val"><i class="fas fa-battery-three-quarters"></i> --%</span>
            <span id="pos-val"><i class="fas fa-crosshairs"></i> Aguardando sinal...</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://droidguard-10597-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('gps');

        const map = L.map('map').setView([-16.6869, -49.2648], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let marker = L.marker([-16.6869, -49.2648]).addTo(map);

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const pos = [data.lat, data.lon];
                marker.setLatLng(pos);
                map.panTo(pos);
                document.getElementById('bat-val').innerHTML = `<i class="fas fa-battery-bolt"></i> ${data.battery}%`;
                document.getElementById('pos-val').innerHTML = `<i class="fas fa-map-marker"></i> ${data.lat.toFixed(5)}, ${data.lon.toFixed(5)}`;
            }
        });
    </script>
</body>
</html>
