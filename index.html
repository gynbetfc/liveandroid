
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidGuard Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #080c0e; --side: #111b1f; --card: #16262c; --teal: #2f8e8b; --white: #e2e8f0; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--white); display: flex; height: 100vh; }
        .sidebar { width: 60px; background: var(--side); border-right: 1px solid #1f2d33; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        .main { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid #1f2d33; }
        #map { height: 200px; border-radius: 8px; }
        .photo-box { width: 100%; height: 250px; background: #000; border-radius: 8px; object-fit: contain; border: 1px solid var(--teal); }
        .status-text { font-size: 13px; color: var(--teal); font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="sidebar"><i class="fas fa-ghost" style="color:var(--teal); font-size:24px;"></i></div>
    <div class="main">
        <div class="status-text">DROIDGUARD PRO // <span id="net">ONLINE</span></div>
        <div class="grid">
            <div class="card">
                <h3><i class="fas fa-camera"></i> Última Captura</h3>
                <img id="cam-img" class="photo-box" src="">
            </div>
            <div class="card">
                <h3><i class="fas fa-map-marker-alt"></i> Localização</h3>
                <div id="map"></div>
            </div>
            <div class="card">
                <h3><i class="fas fa-battery-half"></i> Energia</h3>
                <p>Bateria: <span id="bat" style="color:var(--teal)">--</span></p>
                <p>Temp: <span id="temp" style="color:var(--teal)">--</span></p>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const conf = { databaseURL: "https://droidguard-10597-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(conf);
        const db = firebase.database().ref('device_status');
        const map = L.map('map', {zoomControl:false}).setView([-16.68, -49.26], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let marker = L.circleMarker([0,0], {color: '#2f8e8b', radius: 8}).addTo(map);

        db.on('value', (s) => {
            const d = s.val();
            if(d) {
                if(d.lat) { marker.setLatLng([d.lat, d.lon]); map.panTo([d.lat, d.lon]); }
                if(d.photo) { document.getElementById('cam-img').src = "data:image/jpeg;base64," + d.photo; }
                document.getElementById('bat').innerText = (d.battery_level || '--') + '%';
                document.getElementById('temp').innerText = (d.temp || '--') + '°C';
                document.getElementById('net').innerText = (d.network || 'OFFLINE').toUpperCase();
            }
        });
    </script>
</body>
</html>
